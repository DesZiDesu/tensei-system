<div id="tensei-system-settings" class="tensei-system-settings">
    <div class="inline-drawer">
        <div class="inline-drawer-toggle inline-drawer-header interactable" tabindex="0" role="button" aria-expanded="false">
            <b><i class="fa-solid fa-book-open" aria-hidden="true"></i> Tensei System</b>
            <div class="inline-drawer-icon fa-solid fa-circle-chevron-down down" aria-hidden="true"></div>
        </div>
        <div class="inline-drawer-content">
            <p class="tensei-system-settings-copy">Mushoku Tensei role-play interface for SillyTavern.</p>
            <label class="checkbox_label" for="tensei-system-show-launcher">
                <input id="tensei-system-show-launcher" type="checkbox" />
                <span>Show in the wand menu</span>
            </label>
            <div class="tensei-system-settings-actions">
                <button id="tensei-system-open-from-settings" class="menu_button">
                    <i class="fa-solid fa-up-right-from-square" aria-hidden="true"></i>
                    Open Tensei System
                </button>
                <span class="tensei-system-ready-state">
                    <i class="fa-solid fa-circle-check" aria-hidden="true"></i>
                    Drawer shell ready
                </span>
            </div>
        </div>
    </div>
</div>
